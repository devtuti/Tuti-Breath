<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="header">
<a class="logo" href="../index.html"><span class="logo-mark">TB</span><span><b>TutiBreath</b><small>PARFUME</small></span></a>
<nav class="desktop-nav">

</nav>
<a class="head-btn" href="../index.html">⌂</a>
<button class="head-btn menu-btn" id="menuBtn">☰</button>
</header>
<main>
<section class="page-hero">
<p class="eyebrow">TUTIBREATH</p>
<h1>Ароматы</h1>
<p>Выберите товар из каталога, посмотрите объём и цену.</p>
</section>
<section class="section">
<div class="filters" id="filters">
<button class="filter active" data-filter="all">Все</button>
<button class="filter" data-filter="original">Оригинал</button>
<button class="filter" data-filter="на_разлив">На разлив</button>
<button class="filter" data-filter="unisex">Унисекс</button>
<button class="filter" data-filter="woman">Женский</button>
<button class="filter" data-filter="man">Мужской</button>
</div>
<div class="search-box page-search"><span>⌕</span><input id="searchInput" placeholder="Поиск товара..."><button id="clearSearch">Очистить</button></div>
<div class="row g-4 grid" id="perfumeGrid"></div>
</section>
</main>
<footer><div class="logo"><span class="logo-mark">TB</span><span><b>TutiBreath</b><small>PARFUME</small></span></div><p>© 2026 TutiBreath. Все права защищены.</p></footer>
<div class="modal" id="productModal">
<div class="modal-backdrop" data-close></div>
<article class="modal-box">
<button class="close" data-close>×</button>
<div class="modal-image" id="modalImage"></div>
<div class="modal-info">
<p class="eyebrow" id="modalCategory"></p>
<h2 id="modalName"></h2>
<p id="modalDescription"></p>
<div id="modalSizes" class="sizes"></div>
<div class="modal-actions">
<button class="btn primary" id="modalOrder">Заказать — WhatsApp</button>
<button class="btn" id="modalShare">↗ Поделиться</button>
</div>
</div>
</article>
</div>
<div class="mobile-menu" id="mobileMenu">
<button class="close" id="closeMenu">×</button>
<a href="perfume.html">Парфюм</a>
<a href="jewelry.html">Бижутерия</a>
<a href="../index.html#sales">Скидки</a>
<a href="favorites.html">♡ Избранное</a>
<a href="contact.html">Контакты</a>
</div>
<nav class="bottom-nav">
<a class="" href="../index.html"><i class="bi bi-house-door-fill"></i><span>Главная</span></a>
<a class=" active" href="perfume.html"><i class="bi bi-stars"></i><span>Парфюм</span></a>
<a class="" href="favorites.html"><i class="bi bi-heart-fill"></i><span>Избранное</span></a>
<a class="" href="jewelry.html"><i class="bi bi-gem"></i><span>Бижутерия</span></a>
<a class="" href="contact.html"><i class="bi bi-telephone-fill"></i><span>Контакты</span></a>
</nav>
<div class="toast" id="toast"></div>
<script src="../data/products.js"></script>
<script src="../js/favorites.js"></script>
<script src="../js/products.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let filter="all",term="";
function render(){
  let arr=PRODUCTS.filter(p=>p.type==="perfume"&&(filter==="all"||p.category===filter||p.tags.includes(filter))&&(!term||[p.name,p.category,...p.tags].join(" ").toLowerCase().includes(term.toLowerCase())));
  $("#perfumeGrid").innerHTML=arr.length?arr.map(productCard).join(""):'<div class="empty" style="grid-column:1/-1">Подходящих товаров не найдено.</div>';
  bind();
}
function bind(){
  $("[data-close]").onclick=closeProduct;
  $("#modalOrder").onclick=()=>currentProduct&&orderProduct(currentProduct.id);
  $("#modalShare").onclick=()=>shareProduct();
  $$("[data-fav]").forEach(x=>x.onclick=()=>{toggleFavorite(x.dataset.fav);render()});
  $$("[data-open]").forEach(x=>x.onclick=()=>openProduct(x.dataset.open));
  $$("[data-order]").forEach(x=>x.onclick=()=>orderProduct(x.dataset.order));
  $$(".filter").forEach(x=>x.onclick=()=>{filter=x.dataset.filter;$$(".filter").forEach(y=>y.classList.remove("active"));x.classList.add("active");render()});
}
$("#searchInput").oninput=e=>{term=e.target.value;render()};
$("#clearSearch").onclick=()=>{$$("#searchInput")[0].value="";term="";render()};
render();
document.getElementById("menuBtn")?.addEventListener("click",()=>document.getElementById("mobileMenu").classList.add("open"));
document.getElementById("closeMenu")?.addEventListener("click",()=>document.getElementById("mobileMenu").classList.remove("open"));
</script>
</body>
</html>
